<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnisys Pro - Gestão Inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--p:#0f223d;--a:#f59e0b;--ok:#16a34a;--no:#dc2626;--w:#f59e0b;
--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--txt:#0f172a;--muted:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt)}
input,select,button,textarea{font-family:inherit}
button{cursor:pointer}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f223d 0%,#1e3a8a 55%,#312e81 100%);padding:20px}
.auth-box{background:#fff;border-radius:18px;box-shadow:0 25px 60px rgba(0,0,0,.35);width:100%;max-width:430px;padding:34px 34px 28px}
.auth-box h1{font-size:1.5rem;color:var(--p);font-weight:800;margin-bottom:4px}
.auth-box h1 span{color:var(--a)}
.auth-box .sub{color:var(--muted);font-size:.85rem;margin-bottom:22px}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fg label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.fg input,.fg select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:.95rem;outline:none;transition:.15s;background:#fff}
.fg input:focus,.fg select:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.fg input[type=checkbox]{width:auto}
.bf{width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#fff;font-weight:700;font-size:1rem;padding:13px;border-radius:10px;transition:.15s}
.bf:hover{filter:brightness(1.08);transform:translateY(-1px)}
.bf:active{transform:translateY(0)}
.link{display:block;text-align:center;margin-top:16px;color:var(--p);font-weight:600;font-size:.85rem;background:none;border:none}
.link:hover{text-decoration:underline}
.terms{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:16px}
.terms input{accent-color:var(--a);width:16px;height:16px}
#dc{display:none}
.topbar{position:fixed;top:0;left:250px;right:0;height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:50}
.topbar .brand{font-weight:800;color:var(--p);font-size:1.05rem}
.topbar .brand span{color:var(--a)}
.topbar .tb-right{display:flex;align-items:center;gap:12px}
.pill{background:var(--bg);border:1px solid var(--line);color:var(--p);padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:600}
.badge-m{display:none;background:var(--p);color:var(--a);padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:800;letter-spacing:.04em}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--p);color:#fff;z-index:60;display:flex;flex-direction:column;overflow-y:auto}
.sidebar .sb-head{padding:20px 20px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .sb-head h2{font-size:1.05rem;font-weight:800}
.sidebar .sb-head h2 span{color:var(--a)}
.sidebar .sb-head .sb-user{font-size:.72rem;color:#94a3b8;margin-top:6px;word-break:break-all}
.smenu{list-style:none;padding:14px 12px;flex:1}
.smenu li .sep{margin:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.smenu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:#cbd5e1;padding:11px 14px;border-radius:9px;font-size:.88rem;font-weight:600;transition:.15s}
.smenu button:hover{background:rgba(255,255,255,.07);color:#fff}
.smenu button.active{background:var(--a);color:#0f223d}
.content{margin:78px 0 0 250px;padding:28px 30px}
#mca{max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}
.card h3{margin:0 0 16px;color:var(--p);font-size:1.02rem}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}.sidebar{width:210px}.topbar{left:210px}.content{margin-left:210px}}
.kpi{border-radius:14px;padding:20px;color:#fff}
.kpi span{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.kpi h2{margin-top:8px;font-size:1.6rem;font-weight:800}
.tb{width:100%;border-collapse:collapse;font-size:.85rem}
.tb th{text-align:left;color:var(--muted);text-transform:uppercase;font-size:.7rem;letter-spacing:.04em;padding:8px 10px;border-bottom:2px solid var(--line)}
.tb td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:hover td{background:#f8fafc}
.bg{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700}
.bgg{background:#dcfce7;color:#166534}
.bgr{background:#fee2e2;color:#991b1b}
.bgy{background:#fef3c7;color:#92400e}
.bgb{background:#dbeafe;color:#1e40af}
.bgp{background:#ede9fe;color:#6b21a8}
.bs{padding:6px 13px;border-radius:7px;font-size:.78rem;font-weight:700;border:none;font-family:inherit}
.be{background:#dcfce7;color:#166534}.be:hover{background:#bbf7d0}
.bd{background:#fee2e2;color:#991b1b}.bd:hover{background:#fecaca}
.bw{background:#f1f5f9;color:#334155}.bw:hover{background:#e2e8f0}
.bo{background:#fef3c7;color:#92400e}.bo:hover{background:#fde68a}
.bsub{background:#f1f5f9;color:#475569;border:1px solid var(--line);padding:8px 15px;border-radius:8px;font-weight:600;font-size:.8rem}
.bsub.act{background:var(--p);color:#fff;border-color:var(--p)}
.bsub:hover{background:#e2e8f0}
.tg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.mc2{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px 10px;text-align:center;transition:.15s}
.mc2:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,34,61,.12)}
.mc2 .mc-num{font-size:1.15rem;font-weight:800;color:var(--p)}
.mc2 .mc-cap{font-size:.68rem;color:var(--muted)}
.mc2.ml{border-color:#16a34a;background:#f0fdf4}.mc2.ml .mc-num{color:#166534}
.mc2.mo{border-color:#dc2626;background:#fef2f2}.mc2.mo .mc-num{color:#991b1b}
.mc2.mr{border-color:#f59e0b;background:#fffbeb}.mc2.mr .mc-num{color:#92400e}
.mi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:.15s}
.mi:hover{border-color:var(--a)}
@media(max-width:640px){.tb{font-size:.75rem}.content{padding:18px 14px}}
</style>
</head>
<body>
<section id="login-screen" class="auth">
<div class="auth-box">
<h1>Omnisys<span> Pro</span></h1>
<p class="sub">Gestão Inteligente · Entre na sua conta</p>
<div class="fg"><label>E-mail</label><input type="email" id="login-u" placeholder="seu@email.com" autocomplete="email"></div>

<div class="auth-box">
<h1>Criar <span>conta</span></h1>

<div class="fg"><label>Ramo de atuação</label><select id="reg-ramo">

<option value="cafeteria">Cafeteria</option>
<option value="loja">Loja</option>

</section>
<div id="dc">
<aside class="sidebar">
<div class="sb-head"><h2>Omnisys<span> Pro</span></h2><div class="sb-user" id="u-email"></div></div>
<ul class="smenu" id="smenu"></ul>
</aside>
<header class="topbar">
<div class="brand">Omnisys<span> Pro</span></div>
<div class="tb-right">

</div>
</header>
<main class="content"><div id="mca"></div></main>
</div>
<script>// ============ DATA LAYER (local + sync com o servidor) ============
let APP={user:null,ramo:'',abaAtual:'',caixaAberto:null,mesaSel:null,pedidoAtual:[],token:null,syncPend:null,syncOn:false};
const DB={
get(k,d){try{return JSON.parse(localStorage.getItem('op_'+k))||d}catch{return d}},
set(k,v){localStorage.setItem('op_'+k,JSON.stringify(v));agendarSync()},
setLocal(k,v){localStorage.setItem('op_'+k,JSON.stringify(v))},
snapshot(){const o={};for(let i=0;i<localStorage.length;i++){const ks=localStorage.key(i);if(ks&&ks.startsWith('op_')&&ks!=='op_sessao'&&ks!=='op_token')o[ks.slice(3)]=JSON.parse(localStorage.getItem(ks))}return o}
};
function sessao(){try{return JSON.parse(localStorage.getItem('op_sessao'))||null}catch{return null}}
function setSessao(u,t){APP.user=u;APP.token=t||APP.token;localStorage.setItem('op_sessao',JSON.stringify(APP.user));localStorage.setItem('op_token',APP.token||'')}
function sairSessao(){try{localStorage.removeItem('op_sessao');localStorage.removeItem('op_token')}catch(e){}APP.user=null;APP.token=null}
let SYNC_TIMER=null;
function agendarSync(){
if(!APP.token)return;
clearTimeout(SYNC_TIMER);
SYNC_TIMER=setTimeout(enviarSync,1200);
}
function iniciarSync(){
if(!APP.token)return;
sessao();
fetch('/api/sync',{headers:{'Authorization':'Bearer '+APP.token}}).then(r=>r.ok?r.json():null).then(j=>{
if(!j)return;
const remoto=j.data||{};
const local=DB.snapshot();
let mudou=false;
for(const k in remoto){if(local[k]===undefined){try{localStorage.setItem('op_'+k,JSON.stringify(remoto[k]))}catch(e){};mudou=true}}
if(mudou){DB.render&&DB.render();if(APP.abaAtual&&R[APP.abaAtual])R[APP.abaAtual](document.getElementById('mca'))}
}).catch(()=>{})
}
async function enviarSync(){
if(!APP.token||APP.syncOn)return;
APP.syncOn=true;
try{
const r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+APP.token},body:JSON.stringify({data:DB.snapshot()})});
if(r.status===401){sairSessao();show('login-screen')}
}catch(e){}
APP.syncOn=false;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function fmt(v){return'R$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}
function hoje(){return new Date().toISOString().split('T')[0]}
function horaA(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function dataA(){const d=new Date();return d.getDate().toString().padStart(2,'0')+'/'+(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getFullYear()}
function show(id){document.querySelectorAll('.auth').forEach(a=>a.style.display='none');document.getElementById(id).style.display='flex'}
function showDash(){document.querySelectorAll('.auth').forEach(a=>a.style.display='none');document.getElementById('dc').style.display='block'}
const REST_RAMOS=['restaurante','bar','pizzaria','cafeteria'];

// ============ MODULOS POR RAMO ============
const MODS={
restaurante:[{id:'dashboard',i:'📊',l:'Dashboard'},{id:'mesas',i:'🪑',l:'Mesas & Salao'},{id:'cardapio',i:'📖',l:'Cardapio'},{id:'pedidos',i:'🧾',l:'Pedidos'},{id:'kds',i:'👨‍🍳',l:'Cozinha KDS'},{id:'pdv',i:'💳',l:'PDV / Caixa'},{id:'estoque',i:'📦',l:'Estoque & Insumos'},{id:'financeiro',i:'💰',l:'Financeiro'},{id:'crm',i:'👥',l:'Clientes CRM'},{id:'relatorios',i:'📈',l:'Relatorios'},{id:'equipe',i:'🧑‍💼',l:'Equipe & Comissoes'},{id:'config',i:'⚙️',l:'Configuracoes'}],

pizzaria:[{id:'dashboard',i:'📊',l:'Dashboard'},{id:'mesas',i:'🪑',l:'Mesas'},{id:'cardapio',i:'📖',l:'Cardapio'},{id:'pedidos',i:'🧾',l:'Pedidos'},{id:'kds',i:'👨‍🍳',l:'Cozinha KDS'},{id:'pdv',i:'💳',l:'PDV / Caixa'},{id:'estoque',i:'📦',l:'Estoque'},{id:'financeiro',i:'💰',l:'Financeiro'},{id:'crm',i:'👥',l:'Clientes'},{id:'relatorios',i:'📈',l:'Relatorios'},{id:'config',i:'⚙️',l:'Config'}],
cafeteria:[{id:'dashboard',i:'📊',l:'Dashboard'},{id:'mesas',i:'🪑',l:'Mesas'},{id:'cardapio',i:'📖',l:'Cardapio'},{id:'pedidos',i:'🧾',l:'Pedidos'},{id:'pdv',i:'💳',l:'PDV'},{id:'estoque',i:'📦',l:'Estoque'},{id:'financeiro',i:'💰',l:'Financeiro'},{id:'crm',i:'👥',l:'Clientes'},{id:'relatorios',i:'📈',l:'Relatorios'},{id:'config',i:'⚙️',l:'Config'}],

salao:[{id:'dashboard',i:'📊',l:'Dashboard'},{id:'agenda',i:'📅',l:'Agenda'},{id:'pedidos',i:'🧾',l:'Atendimentos'},{id:'pdv',i:'💳',l:'PDV'},{id:'estoque',i:'📦',l:'Produtos'},{id:'financeiro',i:'💰',l:'Financeiro'},{id:'crm',i:'👥',l:'Clientes/CRM'},{id:'relatorios',i:'📈',l:'Relatorios'},{id:'equipe',i:'🧑‍💼',l:'Profissionais'},{id:'config',i:'⚙️',l:'Config'}],

academia:[{id:'dashboard',i:'📊',l:'Dashboard'},{id:'pedidos',i:'🧾',l:'Matriculas'},{id:'pdv',i:'💳',l:'PDV'},{id:'financeiro',i:'💰',l:'Financeiro'},{id:'crm',i:'👥',l:'Alunos'},{id:'relatorios',i:'📈',l:'Relatorios'},{id:'config',i:'⚙️',l:'Config'}],
hotel:[{id:'dashboard',i:'📊',l:'Dashboard'},{id:'mesas',i:'🛏️',l:'Quartos'},{id:'pedidos',i:'🧾',l:'Hospedagens'},{id:'pdv',i:'💳',l:'PDV'},{id:'estoque',i:'📦',l:'Estoque'},{id:'financeiro',i:'💰',l:'Financeiro'},{id:'crm',i:'👥',l:'Hospedes'},{id:'relatorios',i:'📈',l:'Relatorios'},{id:'config',i:'⚙️',l:'Config'}],

function getMods(){return MODS[APP.ramo]||MODS.geral}

// ============ AUTH ============
async function executarCadastro(){
const nome=document.getElementById('reg-nome').value.trim();
const email=document.getElementById('reg-email').value.trim();
const senha=document.getElementById('reg-senha').value.trim();
const ramo=document.getElementById('reg-ramo').value;
if(!nome||!email||!senha){alert('Preencha nome, e-mail e senha!');return}
if(senha.length<8){alert('A senha deve ter no mínimo 8 caracteres!');return}
if(!document.getElementById('reg-termos').checked){alert('Aceite os termos!');return}
try{
const r=await fetch('/api/usuarios/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,email,password:senha,ramo,doc:document.getElementById('reg-doc').value.trim(),tel:document.getElementById('reg-tel').value.trim()})});
if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.detail||'Erro ao cadastrar. Tente novamente.');return}
}catch(e){alert('Servidor indisponível. Verifique sua conexão.');return}
alert('Cadastro realizado! Faça login.');show('login-screen');
}

async function fazerLogin(){
const email=document.getElementById('login-u').value.trim();
const senha=document.getElementById('login-s').value.trim();
if(!email||!senha){alert('Preencha e-mail e senha!');return}
const btn=document.querySelector('#login-screen .bf');if(btn){btn.disabled=true;btn.textContent='Entrando...'}
try{
const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:senha})});
const d=await r.json().catch(()=>({}));
if(!r.ok){alert((d.detail||'Email ou senha incorretos').replace('Email','E-mail'));return}
APP.ramo=d.user.ramo||'geral';
setSessao(d.user,d.token);
iniciar();iniciarSync();

${pend.map(p=>`<tr><td>#${p.id.slice(-5).toUpperCase()}</td><td>${p.clienteNome||p.mesaNome||'—'}</td><td><strong>${fmt(p.total)}</strong></td>

function abrirCaixa(){
const v=parseFloat(document.getElementById('cx-abertura').value)||0;
const cx=DB.get('caixas',[]);
cx.push({id:uid(),abertura:dataA()+' '+horaA(),saldoInicial:v,movimentos:[],status:'aberto'});

}
function fecharCaixa(){
if(!APP.caixaAberto)return;
if(!confirm('Fechar o caixa?'))return;
const c=APP.caixaAberto;
c.fechamento=dataA()+' '+horaA();
c.fechamentoValor=c.movimentos.reduce((s,m)=>s+parseFloat(m.valor||0),0);
c.status='fechado';
const cx=DB.get('caixas',[]);
DB.set('caixas',cx.map(x=>x.id===c.id?c:x));
const extra=parseFloat(prompt('Valor em espécie extra (trocos/retiradas)? Ou 0:','0'))||0;
alert(`Caixa Fechado!\nAbertura: ${c.abertura}\nSaldo Inicial: ${fmt(c.saldoInicial)}\nMovimentado: ${fmt(c.fechamentoValor)}\nTotal Final: ${fmt(c.fechamentoValor+extra)}`);

function iniciarPagamento(id){
const pend=DB.get('pedidos',[]),p=pend.find(x=>x.id===id);if(!p)return;
const el=document.getElementById('pdv-pay');
el.style.display='block';
el.innerHTML=`<div class="card"><h3>Pagamento - Pedido #${p.id.slice(-5).toUpperCase()} | ${fmt(p.total)}</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="bs bo" onclick="registrarPagamento('${id}','Dinheiro')">Dinheiro 💵</button>

}
function registrarPagamento(id,forma){
const ped=DB.get('pedidos',[]),p=ped.find(x=>x.id===id);if(!p)return;
p.status='fechado';p.pagamento=forma;p.pago=hoje();
DB.set('pedidos',ped);
if(p.mesaId){const mes=DB.get('mesas',[]),m=mes.find(x=>x.id===p.mesaId);if(m){m.status='livre';m.pedido=null;DB.set('mesas',mes)}}
if(APP.caixaAberto){APP.caixaAberto.movimentos.push({id:uid(),valor:p.total,forma,desc:'Pedido #'+p.id.slice(-5).toUpperCase(),data:dataA()+' '+horaA()});DB.set('caixas',DB.get('caixas',[]))}
const fin=DB.get('financeiro',[]);
fin.push({id:uid(),tipo:'receita',descricao:'Venda '+forma+' - Pedido #'+p.id.slice(-5).toUpperCase(),valor:p.total,categoria:'Vendas',data:hoje()});
DB.set('financeiro',fin);
if(p.clienteId){const cli=DB.get('clientesCRM',[]),c=cli.find(x=>x.id===p.clienteId);if(c){c.pontos=(parseInt(c.pontos||0)+Math.floor(p.total));DB.set('clientesCRM',cli)}}
rPDV(document.getElementById('mca'));
}
function dividirConta(id){
const q=parseInt(prompt('Quantas pessoas?'))||2;if(q<2)return;
const ped=DB.get('pedidos',[]),p=ped.find(x=>x.id===id);if(!p)return;
const val=p.total/q;
alert(`Conta dividida em ${q} partes de ${fmt(val)} cada.\nRegistre cada pagamento abaixo.`);
rPDV(document.getElementById('mca'));
}

function baixarEstoque(id){

const est=DB.get('estoque',[]),e=est.find(x=>x.id===id);

async function buscarEAN(){
const cod=document.getElementById('es-cod').value.trim();
if(!cod){alert('Digite o código de barras!');return}
if(!/^\d{8,14}$/.test(cod)){alert('EAN inválido!');return}
try{
const d=await fetch('https://world.openfoodfacts.org/api/v2/product/'+cod+'.json').then(r=>r.json());
if(d&&d.status===1&&d.product){
const pr=d.product;
document.getElementById('es-nome').value=pr.product_name||'';
document.getElementById('es-cat').value=(pr.categories||'').split(',')[0]||'';
document.getElementById('es-prev').value=pr.nutriscore_grade?'':'';
alert('Produto encontrado: '+pr.product_name);
}else{alert('Código não encontrado no banco OpenFoodFacts. Preencha manualmente.')}
}catch(e){alert('Erro ao buscar. Preencha manualmente.')}
}

function gerarCupom(id){

function editarCRM(id){

// ============ RELATORIOS ============
function rRel(el){
const ped=DB.get('pedidos',[]);
const fech=ped.filter(p=>p.status==='fechado');
const receita=fech.reduce((s,p)=>s+parseFloat(p.total||0),0);
const ticket=receita/(fech.length||1);
const tR=DB.get('financeiro',[]).filter(f=>f.tipo==='receita').reduce((s,f)=>s+parseFloat(f.valor||0),0);
const tD=DB.get('financeiro',[]).filter(f=>f.tipo==='despesa').reduce((s,f)=>s+parseFloat(f.valor||0),0);
const margem=tR?((tR-tD)/tR*100):0;
const items={};
fech.forEach(p=>(p.itens||[]).forEach(i=>{items[i.nome]=items[i.nome]||{qtd:0,rec:0};items[i.nome].qtd+=parseInt(i.qtd||1);items[i.nome].rec+=(i.qtd||1)*(i.preco||0)}));
const top=Object.entries(items).sort((a,b)=>b[1].qtd-a[1].qtd).slice(0,10);
const porDia={};
fech.forEach(p=>{porDia[p.data]=porDia[p.data]||0;porDia[p.data]+=parseFloat(p.total||0)});
const dias=Object.entries(porDia).sort().reverse();
const cliGasto={};
fech.forEach(p=>{if(p.clienteId){cliGasto[p.clienteId]=(cliGasto[p.clienteId]||0)+parseFloat(p.total||0)}});
const topCli=Object.entries(cliGasto).sort((a,b)=>b[1]-a[1]).slice(0,10);
const cliMap={};DB.get('clientesCRM',[]).forEach(c=>cliMap[c.id]=c.nome);
el.innerHTML=`<h2 style="margin:0 0 20px;color:var(--p)">Relatórios</h2>
<div class="g4" style="margin-bottom:20px">
<div class="kpi" style="background:linear-gradient(135deg,#0f223d,#1e3a8a)"><span>Total Pedidos</span><h2>${ped.length}</h2></div>
<div class="kpi" style="background:linear-gradient(135deg,#2563eb,#1d4ed8)"><span>Ticket Médio</span><h2>${fmt(ticket)}</h2></div>
<div class="kpi" style="background:linear-gradient(135deg,#16a34a,#15803d)"><span>Receita</span><h2>${fmt(receita)}</h2></div>
<div class="kpi" style="background:linear-gradient(135deg,#d97706,#b45309)"><span>Margem</span><h2>${margem.toFixed(1)}%</h2></div></div>
<div class="g2">
<div class="card"><h3>📊 Top Produtos</h3>${top.length?`<table class="tb"><thead><tr><th>Item</th><th>Qtd</th><th>Receita</th></tr></thead><tbody>${top.map(([n,v],ix)=>`<tr><td>${ix+1}. ${n}</td><td>${v.qtd}</td><td>${fmt(v.rec)}</td></tr>`).join('')}</tbody></table>`:'<div style="color:#64748b;padding:15px;text-align:center">Sem dados.</div>'}</div>
<div class="card"><h3>💰 Top Clientes</h3>${topCli.length?`<table class="tb"><thead><tr><th>Cliente</th><th>Gasto</th></tr></thead><tbody>${topCli.map(([id,v],ix)=>`<tr><td>${ix+1}. ${cliMap[id]||'ID '+id.slice(-5)}</td><td>${fmt(v)}</td></tr>`).join('')}</tbody></table>`:'<div style="color:#64748b;padding:15px;text-align:center">Sem dados.</div>'}</div>
<div class="card" style="grid-column:1/-1"><h3>Receita por Dia</h3>${dias.length?`<table class="tb"><thead><tr><th>Data</th><th>Receita</th></tr></thead><tbody>${dias.map(([d,v])=>`<tr><td>${d}</td><td>${fmt(v)}</td></tr>`).join('')}</tbody></table>`:'<div style="color:#64748b;padding:15px;text-align:center">Sem dados.</div>'}</div>
</div>`;
}

function salvarConfig(){
const cfg=DB.get('config',{});
cfg.nome=document.getElementById('cf-nome').value.trim();
cfg.doc=document.getElementById('cf-doc').value.trim();
cfg.tel=document.getElementById('cf-tel').value.trim();
cfg.email=document.getElementById('cf-email').value.trim();

DB.set('config',cfg);
if(ramo!==APP.ramo){APP.ramo=ramo;if(APP.user)APP.user.ramo=ramo;DB.setLocal('sessao',APP.user);renderSidebar();iniciar();}
else{alert('Configurações salvas!');rConfig(document.getElementById('mca'))}
}
function exportarDados(){
const dados={};
for(const k of Object.keys(localStorage)){
if(k.startsWith('op_'))dados[k.slice(3)]=JSON.parse(localStorage.getItem(k));
}
const blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='omnisys-backup-'+hoje()+'.json';
a.click();
}
function importarDados(ev){
const f=ev.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=()=>{try{const d=JSON.parse(r.result);Object.keys(d).forEach(k=>DB.set(k,d[k]));alert('Dados importados com sucesso!');iniciar()}catch(e){alert('Arquivo inválido!')}};
r.readAsText(f);
}
function limparTudo(){
if(!confirm('TEM CERTEZA? Isto apagará TODOS os dados locais do sistema!')){
return}
if(!confirm('Confirma definitivamente?'))return;
Object.keys(localStorage).filter(k=>k.startsWith('op_')).forEach(k=>localStorage.removeItem(k));
alert('Todos os dados foram apagados.');sairDoApp();
}

// ============ AGENDA ============
function rAgenda(el){
const agr=DB.get('agenda',{});
const hojeData=new Date();
const m=hojeData.getMonth(),y=hojeData.getFullYear();
const mesNome=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m];
const primeiro=new Date(y,m,1).getDay();
const diasMes=new Date(y,m+1,0).getDate();
const semanas=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
el.innerHTML=`<h2 style="margin:0 0 10px;color:var(--p)">Agenda ${mesNome} ${y}</h2>
<div style="display:flex;gap:10px;margin-bottom:15px;align-items:center">
<button class="bsub" onclick="mudarMesAgenda(-1)">◀ Anterior</button>
<button class="bsub" onclick="mudarMesAgenda(1)">Próximo ▶</button>
<span style="font-size:.85rem;color:#64748b">Clique em um dia para adicionar anotação.</span></div>
<div class="tg2" style="grid-template-columns:repeat(7,1fr);gap:8px;min-width:720px">
${semanas.map(s=>`<div style="text-align:center;font-weight:700;font-size:.78rem;color:var(--p);text-transform:uppercase;padding:6px">${s}</div>`).join('')}
${Array(primeiro).fill(0).map(()=>'<div></div>').join('')}
${Array(diasMes).fill(0).map((_,i)=>{const dia=i+1;const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dia).padStart(2,'0');const nota=agr[key]||'';const isHoje=key===hoje();return`<div class="mi" style="min-height:90px;${isHoje?'border:2px solid var(--a)':''}" onclick="verAgenda('${key}')">
<div style="font-weight:700;font-size:1rem;color:${isHoje?'var(--a)':'var(--p)'}">${dia}</div>
${nota?`<div style="font-size:.7rem;color:var(--w);margin-top:4px;max-height:50px;overflow:hidden">📝 ${nota}</div>`:''}
</div>`}).join('')}
</div>`;
}
function mudarMesAgenda(delta){
rAgenda(document.getElementById('mca'));
}
function verAgenda(key){
const agr=DB.get('agenda',{});
const nota=prompt('Anotação para '+key+':',agr[key]||'')+'';
if(nota&&nota!=='null')agr[key]=nota;else delete agr[key];
DB.set('agenda',agr);rAgenda(document.getElementById('mca'));
}

// ============ BOOT ============
(function boot(){
window.addEventListener('online',()=>{if(APP.token)enviarSync()});
const s=sessao();
const t=(function(){try{return localStorage.getItem('op_token')}catch(e){return null}})();
if(s&&t){setSessao(s,t);APP.ramo=s.ramo||'geral';iniciar();iniciarSync();return}
if(s&&!t){const us=s;APP.ramo=us.ramo||'geral';APP.user=us;iniciar();return}
show('login-screen');
})();
</script>
